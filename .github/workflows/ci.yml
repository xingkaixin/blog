name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Audit dependencies
        # The affected picomatch copies come from build and test tooling, outside the Worker request path.
        # Remove this exception when a fixed release is available or the advisory is withdrawn.
        run: |
          echo "::warning title=Temporary audit exception::GHSA-fc5q-39xc-vjpf has no patched picomatch release. https://github.com/advisories/GHSA-fc5q-39xc-vjpf"
          bun audit --ignore=GHSA-fc5q-39xc-vjpf
      - name: Validate source and production output
        run: bun run isok
